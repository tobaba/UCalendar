<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="UCalendar — 任务栏上的日历，会动手的 AI 小秘书">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#07060c"/>
      <stop offset="1" stop-color="#0c0918"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4de1ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e4dbff"/>
      <stop offset="1" stop-color="#9d81ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de1ff"/>
      <stop offset="0.5" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b79bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8b6cff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b6cff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="640" y="0" width="560" height="360" fill="url(#dots)"/>

  <ellipse cx="1000" cy="70" rx="380" ry="230" fill="url(#violet)"/>
  <ellipse cx="110" cy="340" rx="320" ry="190" fill="url(#cyan)"/>

  <g fill="none" stroke="#4de1ff" stroke-opacity="0.28" stroke-width="1.2">
    <path d="M0 36 H210"/>
    <path d="M640 54 H706 l22 -20 H980"/>
    <path d="M0 336 H150 l22 -22 H470"/>
  </g>
  <g fill="none" stroke="#8b6cff" stroke-width="1.6" stroke-linecap="round">
    <path d="M0 36 H210" stroke-dasharray="34 260" stroke-opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <path d="M640 54 H706 l22 -20 H980" stroke-dasharray="26 520" stroke-opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="560;0" dur="5.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#b79bff">
    <circle cx="210" cy="36" r="3"/>
    <circle cx="728" cy="34" r="3"/>
    <circle cx="470" cy="314" r="3"/>
  </g>

  <text x="68" y="90" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="5" fill="#6f6690">/// DESKTOP CALENDAR · AI ASSISTANT</text>

  <text x="64" y="188" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="86" font-weight="800" letter-spacing="0" fill="url(#name)">UCalendar</text>

  <rect x="68" y="208" width="300" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" values="300;420;300" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="68" y="248" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#b6add2">任务栏上的日历 · 会动手的 AI 小秘书</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#cfc4ee">
    <rect x="68" y="274" width="136" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="136" y="294" text-anchor="middle">Windows 10/11</text>
    <rect x="216" y="274" width="132" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="282" y="294" text-anchor="middle">8 MB 单文件</text>
    <rect x="360" y="274" width="148" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#2c2344"/>
    <text x="434" y="294" text-anchor="middle">数据全在本机</text>
  </g>

  <g>
    <rect x="736" y="52" width="400" height="256" rx="14" fill="#0b0914" stroke="#2c2344" stroke-width="1.2"/>
    <path d="M736 66 a14 14 0 0 1 14 -14 h372 a14 14 0 0 1 14 14 v12 h-400 Z" fill="#120e22"/>
    <circle cx="760" cy="68" r="4" fill="#ff5f57"/>
    <circle cx="776" cy="68" r="4" fill="#febc2e"/>
    <circle cx="792" cy="68" r="4" fill="#28c840"/>
    <text x="936" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f6690">powershell — UCalendar</text>

    <g font-family="Consolas, ui-monospace, monospace" font-size="12.5">
      <text x="758" y="114" fill="#6f6690">PS D:\apps&gt;</text>
      <text x="838" y="114" fill="#e6dfff">.\UCalendar.exe</text>

      <text x="758" y="144" fill="#7ee0b0">✓</text>
      <text x="772" y="144" fill="#b6add2">tray + clock widget ready</text>

      <text x="758" y="172" fill="#7ee0b0">✓</text>
      <text x="772" y="172" fill="#b6add2">sqlite · data\ucalendar.db</text>

      <text x="758" y="206" fill="#8b6cff">&gt;</text>
      <text x="774" y="206" fill="#e6dfff">明天下午三点开会</text>

      <text x="758" y="234" fill="#4de1ff" fill-opacity="0.85">→</text>
      <text x="774" y="234" fill="#b6add2">event written  15:00</text>

      <text x="758" y="272" fill="#8b6cff">&gt;</text>
      <rect x="774" y="261" width="8" height="14" fill="#b79bff">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g>
    <rect x="150" y="110" width="130" height="64" fill="url(#sweep)" opacity="0.09" transform="skewX(-18)">
      <animateTransform attributeName="transform" type="translate" values="-260 0;1160 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="357" width="1200" height="2" fill="url(#hair)"/>
</svg>
